{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" type="text/css" href="{% static 'm1/main.css' %}">
    <title>{{ title }}</title>
    {% if display_ga %}
      <!-- Google tag (gtag.js) -->
      <script async src="https://www.googletagmanager.com/gtag/js?id=G-LP86VQPV8N"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-LP86VQPV8N');
      </script>
    {% endif %}
  </head>
  <body>
    <div class="container-fluid">
        <div class="row">
          <h1 class="text-center ibm-plex-sans-regular">US RIFLE M1.COM</h1>
          <div class="col mt-4" id="left-sidebar">

          </div>
          <div class="col-xs-12 col-lg-6 mt-4" id="content-body">
              <!-- Message code to show message from the register form -->
              {% if messages %}
              {% for message in messages %}
                  <div class="alert alert-{{ message.tags }}">
                  {{ message }}
                  </div>
              {% endfor %}
              {% endif %}
              <!-- end message code -->
              {% block content %}
              {% endblock %}

              {% block date %}
              {% endblock date %}
          </div>
          <div class="col mt-4" id="right-sidebar">
              
          </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  </body>
</html>
